[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "cenreg"
version = "0.1.0"
authors = [
  { name="Hiroki Yanagisawa", email="yanagisawa_hiroki@cyberagent.co.jp" },
]
description = "A Python library for censored regression."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

dependencies = [
  "numpy",
  "scipy",
]

[dependency-groups]
dev = [
  "ty",
  "ruff",
  "pytest",
]
optional = [
  "pandas",
  "scikit-learn",
  "matplotlib",
]

[project.urls]
Homepage = "https://github.com/CyberAgentAILab/cenreg"
Issues = "https://github.com/CyberAgentAILab/cenreg/issues"

[tool.ruff]
# Ruff only supports pyproject.toml, not setup.cfg.
# Implicit configurations as default: https://docs.astral.sh/ruff/configuration/
lint.select = [
    "W",      # pycodestyle warnings
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "S",      # flake8-bandit
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "I",      # isort
    "C90",    # mccabe complexity
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
]
# Allow automatic fixes for all fixable issues
lint.fixable = ["ALL"]
# Same as MacBookPro (15inch) and IDEs, 1920px full width.
line-length = 120

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true
# The format to use for printing diagnostic messages.
output-format = "full"
